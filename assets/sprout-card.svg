<svg xmlns="http://www.w3.org/2000/svg" width="400" height="206" viewBox="0 0 400 206" role="img" aria-label="Sprout: habit ring and checklist">
  <!-- panel -->
  <rect width="400" height="206" fill="#CFEBC9"/>
  <!-- tag bar -->
  <rect width="400" height="36" fill="#A8E6A1"/>
  <line x1="0" y1="36" x2="400" y2="36" stroke="#1F3324" stroke-width="2"/>
  <text x="18" y="23" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#1F3324">TAG 01 · WEB APP</text>
  <circle cx="375" cy="18" r="7" fill="#F6FAF1" stroke="#1F3324" stroke-width="2.5"/>
  <!-- habit ring -->
  <g transform="translate(70 61)">
    <circle cx="60" cy="60" r="44" fill="#F6FAF1" stroke="#1F3324" stroke-width="3"/>
    <circle cx="60" cy="60" r="28" fill="none" stroke="#1F3324" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="14" fill="#F7B6CE" stroke="#1F3324" stroke-width="3"/>
  </g>
  <!-- checklist -->
  <g stroke="#1F3324" stroke-width="2.5">
    <rect x="232" y="90" width="22" height="22" fill="#FBE79A"/>
    <rect x="232" y="123" width="22" height="22" fill="#FBE79A"/>
    <rect x="232" y="156" width="22" height="22" fill="#F6FAF1"/>
  </g>
  <g fill="#1F3324">
    <rect x="264" y="98" width="88" height="6"/>
    <rect x="264" y="131" width="62" height="6"/>
    <rect x="264" y="164" width="76" height="6"/>
  </g>
  <!-- outer border -->
  <rect x="1.25" y="1.25" width="397.5" height="203.5" fill="none" stroke="#1F3324" stroke-width="2.5"/>
</svg>
