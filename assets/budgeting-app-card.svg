  <!-- tag bar -->
  <rect width="400" height="36" fill="#F7B6CE"/>
  <line x1="0" y1="36" x2="400" y2="36" stroke="#1F3324" stroke-width="2"/>
  <text x="18" y="23" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#1F3324">TAG 02 · WEB APP</text>
